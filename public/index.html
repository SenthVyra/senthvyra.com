<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Senthalan Vyravanathan's personal portfolio website - Showcasing skills, projects, and achievements.">
    
    <title>Senth Vyra</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.jpg">
    
    <!-- Manifest for PWA -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- SEO Meta Tags -->
    <meta itemprop="name" content="Senthalan Vyravanathan">
    <meta itemprop="description" content="A self-developed portfolio website built with React.js, showcasing projects and expertise.">
    <meta itemprop="image" content="https://senthvyra.com/assets/portfolio-preview.png">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:url" content="https://senthvyra.com">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Senthalan Vyravanathan">
    <meta property="og:description" content="Explore my software engineering journey, projects, and innovations.">
    <meta property="og:image" content="https://senthvyra.com/assets/portfolio-preview.png">
    
    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Senthalan Vyravanathan">
    <meta name="twitter:description" content="Discover my work in software development, AI, and cybersecurity.">
    <meta name="twitter:image" content="https://senthvyra.com/assets/portfolio-preview.png">
    
    <!-- CSS & JS -->
    <link href="/static/css/main.css" rel="stylesheet">
    <script defer src="/static/js/main.js"></script>
</head>
<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
</body>
</html>
